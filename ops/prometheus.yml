# Exemple de configuration Prometheus : lit les métriques du gateway sur le port INTERNE 9090.
# Prometheus doit être sur le réseau banking-network ; "tasks.api-gateway" résout toutes les instances (mode global).
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["tasks.api-gateway"]
        type: A
        port: 9090
