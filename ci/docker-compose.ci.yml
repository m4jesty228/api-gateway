# Environnement CI local : Jenkins + SonarQube (+ sa base PostgreSQL).
# Démarrage :  docker compose -f ci/docker-compose.ci.yml up -d --build
# Jenkins : http://localhost:8088      SonarQube : http://localhost:9000
# Prévoir au moins 4 Go de mémoire pour Docker Desktop (Réglages > Resources).

services:

  jenkins:
    build: ./jenkins
    container_name: jenkins
    # root : nécessaire pour utiliser le socket Docker monté ci-dessous. Acceptable pour un laboratoire local,
    # à proscrire en production (accès au socket Docker = contrôle total de la machine).
    user: root
    ports:
      - "8088:8080"            # 8080 est déjà pris par le gateway
    environment:
      # Testcontainers tourne dans ce conteneur mais pilote le Docker de la machine :
      # il doit joindre les conteneurs de test via l'hôte
      TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins_home:/var/jenkins_home                # configuration, jobs, dépôt Maven, base NVD
      - /var/run/docker.sock:/var/run/docker.sock     # builds Docker et Testcontainers
    networks:
      - ci-net
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://sonar-db:5432/sonar"
      SONAR_JDBC_USERNAME: "sonar"
      SONAR_JDBC_PASSWORD: "sonar-local-only"         # mot de passe de laboratoire, la base n'est pas exposée
      # Docker Desktop (WSL2) : évite l'erreur "vm.max_map_count too low" d'Elasticsearch. Usage local uniquement.
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - ci-net
    restart: unless-stopped

  sonar-db:
    image: postgres:17-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: "sonar"
      POSTGRES_PASSWORD: "sonar-local-only"
      POSTGRES_DB: "sonar"
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ci-net
    restart: unless-stopped

volumes:
  jenkins_home:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db:

networks:
  ci-net:
    name: ci-net
